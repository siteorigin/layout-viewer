# Deploys through the shared SiteOrigin workflow; siteorigin/.github's README
# names the secrets. master deploys the layouts.siteorigin.com theme.
name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    uses: siteorigin/.github/.github/workflows/deploy.yml@v1
    with:
      live: deploy-layout-viewer
    secrets: inherit
